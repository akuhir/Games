name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3
  EXPORT_NAME: RacingGame

jobs:
  export-android:
    name: Android Export
    runs-on: ubuntu-22.04

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure Godot Android environment
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config

          # Copy the preconfigured Godot settings from the CI image.
          cp -r /root/.config/godot ~/.config/godot

          # Install the Godot 4.3 export templates.
          cp -r \
            /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
            ~/.local/share/godot/export_templates/

      - name: Verify Android environment
        run: |
          echo "Godot:"
          godot --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Android SDK:"
          ls -la /usr/lib/android-sdk

          echo ""
          echo "Build Tools:"
          ls -la /usr/lib/android-sdk/build-tools/

          echo ""
          echo "Godot settings:"
          cat ~/.config/godot/editor_settings-4.3.tres

      - name: Import project
        run: |
          godot --headless --editor --quit

      - name: Build Android debug APK
        run: |
          mkdir -p build/android

          godot \
            --headless \
            --verbose \
            --export-debug \
            "Android" \
            "build/android/${EXPORT_NAME}.apk"

      - name: Verify APK
        run: |
          echo "Generated files:"
          ls -lh build/android/

          test -f "build/android/${EXPORT_NAME}.apk"

          echo ""
          echo "APK successfully created:"
          ls -lh "build/android/${EXPORT_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RacingGame-android-debug
          path: build/android/${{ env.EXPORT_NAME }}.apk