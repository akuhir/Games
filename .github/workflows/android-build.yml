name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3
  EXPORT_NAME: RacingGame
  ANDROID_HOME: /opt/android-sdk
  ANDROID_SDK_ROOT: /opt/android-sdk
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

jobs:
  export-android:
    name: Android Export
    runs-on: ubuntu-22.04

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Android SDK
        run: |
          mkdir -p "$ANDROID_HOME"

          if [ -d "/usr/lib/android-sdk" ]; then
            cp -a /usr/lib/android-sdk/. "$ANDROID_HOME/"
          elif [ -d "/opt/android-sdk" ]; then
            echo "Android SDK already exists at /opt/android-sdk"
          else
            echo "ERROR: Android SDK not found in container"
            exit 1
          fi

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/33.0.2:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "Available Build Tools:"
          find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d -print || true

          echo "Available Platforms:"
          find "$ANDROID_HOME/platforms" -maxdepth 1 -mindepth 1 -type d -print || true

      - name: Install required Android components
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses || true
            sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          else
            echo "sdkmanager not found; checking existing SDK..."
          fi

          test -d "$ANDROID_HOME/build-tools/33.0.2"
          test -d "$ANDROID_HOME/platforms/android-33"

      - name: Configure Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          test -x "$JAVA_HOME/bin/java"

      - name: Configure Godot
        run: |
          mkdir -p ~/.config/godot
          mkdir -p ~/.local/share/godot/export_templates

          if [ -d "/root/.config/godot" ]; then
            cp -a /root/.config/godot/. ~/.config/godot/
          fi

          cp -a \
            /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
            ~/.local/share/godot/export_templates/

      - name: Configure Android environment for Godot
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/33.0.2" >> "$GITHUB_PATH"

      - name: Verify Android SDK
        run: |
          echo "=== Java ==="
          java -version

          echo ""
          echo "=== Android SDK ==="
          ls -la "$ANDROID_HOME"

          echo ""
          echo "=== Build Tools 33.0.2 ==="
          ls -la "$ANDROID_HOME/build-tools/33.0.2"

          echo ""
          echo "=== Android 33 Platform ==="
          ls -la "$ANDROID_HOME/platforms/android-33"

      - name: Import project
        run: |
          godot --headless --editor --quit

      - name: Build Android debug APK
        run: |
          mkdir -p build/android

          godot \
            --headless \
            --verbose \
            --export-debug \
            "Android" \
            "build/android/${EXPORT_NAME}.apk"

      - name: Verify APK
        run: |
          echo "=== Build output ==="
          ls -lh build/android/

          if [ ! -f "build/android/${EXPORT_NAME}.apk" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          echo ""
          echo "APK successfully created:"
          ls -lh "build/android/${EXPORT_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RacingGame-android-debug
          path: build/android/${{ env.EXPORT_NAME }}.apk